name: CI

# Runs on every push/PR: unit tests for the PySpark transformation logic (Bronze/Silver),
# a full dbt build+test against a freshly-generated sample dataset (Gold), and a
# Terraform format/validate check (infra is never applied in CI -- see infra/README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Unit tests (Bronze/Silver PySpark logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest tests/ -v

  dbt-build:
    name: dbt build + test (Gold layer, sample data)
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reference data + sample Bronze events
        run: |
          cd bronze
          python reference_data.py
          python producer.py --n-events 2000 --ingest-date 2026-07-24

      - name: Run Silver jobs
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          cd silver
          python clean_transactions.py --lake-root ../data_lake
          python clean_customers.py --lake-root ../data_lake

      - name: dbt build (no `dbt deps` needed -- see gold/packages.yml)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/gold
        run: |
          cd gold
          cp profiles.yml.example profiles.yml
          dbt build --vars '{silver_lake_path: "../data_lake/silver"}'

  terraform-check:
    name: Terraform format + validate (not applied -- see infra/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt -check
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform init (no backend, no credentials needed for validate)
        run: terraform -chdir=infra init -backend=false

      - name: terraform validate
        run: terraform -chdir=infra validate
