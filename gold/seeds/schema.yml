version: 2

seeds:
  - name: ref_products
    description: Static product reference data, generated by bronze/reference_data.py.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: list_price
        tests:
          - accepted_range:
              min_value: 0

  - name: ref_stores
    description: Static store reference data, generated by bronze/reference_data.py.
    columns:
      - name: store_id
        tests: [unique, not_null]

  - name: ref_customer_ids
    description: Static universe of customer ids, generated by bronze/reference_data.py.
    columns:
      - name: customer_id
        tests: [unique, not_null]
